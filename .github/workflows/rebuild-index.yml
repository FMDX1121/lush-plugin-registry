name: Rebuild Community Index

on:
  push:
    branches: [main]
    paths:
      - 'submissions/**.json'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 重建索引
        run: python scripts/build_community_index.py

      - name: 提交变更
        run: |
          git config user.name "lush-bot"
          git config user.email "bot@lush.local"
          git add index-community.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: 重建社区索引"
          git push